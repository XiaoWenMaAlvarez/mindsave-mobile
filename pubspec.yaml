name: mindsave
description: "Mindsave - Aplicación móvil de bienestar emocional y TCC."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  flyer_chat_image_message: ^2.3.0
  fl_chart: ^1.2.0
  file_saver: ^0.4.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  pdf: ^3.12.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
